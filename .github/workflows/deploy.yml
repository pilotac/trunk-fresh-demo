name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag, branch or SHA) to deploy
        required: true
        default: main
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy
        run: npm ci && node -e "console.log('deployed', require('child_process').execSync('git rev-parse HEAD').toString().trim())"
